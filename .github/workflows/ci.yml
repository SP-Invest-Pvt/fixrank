name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[test]"
      - run: pytest -q --cov=fixrank --cov-report=term-missing
      - name: CLI smoke test
        run: |
          python -m fixrank --help > /dev/null
          python -m fixrank rank --sast examples/findings.sarif --kev examples/kev.csv --epss examples/epss.csv \
            --reach examples/reach.csv --inventory examples/assets.yaml --config examples/config.yaml
